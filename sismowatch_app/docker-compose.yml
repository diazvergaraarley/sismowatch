x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: sismowatch-airflow:latest
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-sismo_user}:${POSTGRES_PASSWORD:-sismo_password}@postgres:5432/${POSTGRES_DB:-sismowatch}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__LOGGING_LEVEL: INFO
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-sismowatch_airflow_secret_key_2026}
    AIRFLOW_UID: "${AIRFLOW_UID:-1001}"
    POSTGRES_USER: ${POSTGRES_USER:-sismo_user}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sismo_password}
    POSTGRES_DB: ${POSTGRES_DB:-sismowatch}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/include:/opt/airflow/include
  networks:
    - sismowatch_net
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    container_name: sismowatch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sismo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sismo_password}
      POSTGRES_DB: ${POSTGRES_DB:-sismowatch}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sismo_user} -d ${POSTGRES_DB:-sismowatch}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sismowatch_net

  airflow-init:
    <<: *airflow-common
    container_name: sismowatch_airflow_init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-sismo_user}:${POSTGRES_PASSWORD:-sismo_password}@postgres:5432/${POSTGRES_DB:-sismowatch}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-sismowatch_airflow_secret_key_2026}
      AIRFLOW_UID: "${AIRFLOW_UID:-1001}"
      POSTGRES_USER: ${POSTGRES_USER:-sismo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sismo_password}
      POSTGRES_DB: ${POSTGRES_DB:-sismowatch}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_WWW_USER_PASSWORD:-admin}
    command: version

  airflow-webserver:
    <<: *airflow-common
    container_name: sismowatch_airflow_webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: sismowatch_airflow_scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: sismowatch_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-sismo_user}:${POSTGRES_PASSWORD:-sismo_password}@postgres:5432/${POSTGRES_DB:-sismowatch}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-supersecreto}
      - VIEWER_USER=${VIEWER_USER:-viewer}
      - VIEWER_PASSWORD=${VIEWER_PASSWORD:-sololeer}
      - JWT_SECRET=${JWT_SECRET:-sismowatch_firma_secreta_2026}
    volumes:
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sismowatch_net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: sismowatch_web
    restart: unless-stopped
    ports:
      - "3000:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - sismowatch_net

volumes:
  postgres_data:
    driver: local

networks:
  sismowatch_net:
    driver: bridge
